name: Integración Continua Nivel 5

on:
  push:
    branches: [ "develop", "master" ]
  pull_request:
    branches: [ "develop", "master" ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Descargar código fuente
      uses: actions/checkout@v4

    - name: Instalar .NET 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    # Ajustamos las rutas eliminando el prefijo "GestionITM/" si el robot ya está dentro de esa carpeta
    - name: Restaurar dependencias
      run: dotnet restore GestionITM.slnx 

    - name: Compilar código
      run: dotnet build GestionITM.slnx --configuration Release --no-restore

    - name: Ejecutar pruebas unitarias
      run: dotnet test GestionITM.slnx --configuration Release --no-build --verbosity normal

    # Ajuste importante para Docker:
    # Según tu imagen, el Dockerfile está en la raíz junto al .slnx
    - name: Validar construcción de imagen de Docker
      run: docker build -t gestion-itm-api:latest -f Dockerfile .